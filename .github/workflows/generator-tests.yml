name: Generator regression
on:
  push:
    branches:
      - feat/f4-auxiliary-curves-import
  pull_request:
    paths:
      - 'index.html'
      - 'generator-view.js'
      - 'stock-preview.js'
      - 'tests/**'
      - '.github/workflows/generator-tests.yml'
jobs:
  generator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run generator tests (no CNC hardware)
        run: node --test tests/generator.test.cjs tests/guide-editor.test.cjs tests/generator-3d-guides.test.cjs tests/generator-modes.test.cjs tests/stock-preview.test.cjs
      - name: Validate OpenCascade checker syntax
        run: python3 -m py_compile tools/verify_f4_solid.py
